{% extends "base.html" %}

{% block content %}
<div class="map-container">
  {% if is_development %}
  <!-- Development mode: Embed Vite dev server in iframe -->
  <iframe
    src="{{ vite_dev_url }}"
    class="map-frame"
    title="World Map"
  ></iframe>
  {% else %}
  <!-- Production mode: Load built assets directly -->
  <div id="root"></div>
  <link rel="stylesheet" href="{{ map_css }}">
  <script type="module" src="{{ map_js }}"></script>
  {% endif %}
</div>

<style>
  /* Scoped map container - fills available content area without breaking layout */
  .map-container {
    position: fixed;
    top: 0;
    right: 0;
    bottom: 0;
    left: 256px; /* Width of sidebar */
    background-color: #111;
    z-index: 10;
  }
  
  /* Mobile: account for hamburger header and collapsible sidebar */
  @media (max-width: 767px) {
    .map-container {
      left: 0;
      top: 56px; /* Height of mobile header */
    }
  }

  .map-frame {
    width: 100%;
    height: 100%;
    border: none;
  }

  #root {
    width: 100%;
    height: 100%;
  }

  canvas {
    image-rendering: pixelated;
    background-color: #111;
  }
</style>
{% endblock %}
